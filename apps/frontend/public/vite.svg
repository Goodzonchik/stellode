<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Квадратный фон со скруглением -->
  <rect x="2" y="2" width="96" height="96" rx="16" fill="#1F2937" />

  <!-- Рёбра графа -->
  <g fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round">
    <line x1="22" y1="50" x2="50" y2="22" />
    <line x1="50" y1="22" x2="78" y2="50" />
    <line x1="22" y1="50" x2="50" y2="78" />
    <line x1="50" y1="78" x2="78" y2="50" />
    <line x1="50" y1="22" x2="50" y2="78" />
  </g>

  <!-- Узлы графа -->
  <g stroke="#1F2937" stroke-width="2">
    <circle cx="22" cy="50" r="6" fill="#00F2FE" />
    <circle cx="50" cy="22" r="6" fill="#FA709A" />
    <circle cx="78" cy="50" r="6" fill="#43E97B" />
    <circle cx="50" cy="78" r="6" fill="#764BA2" />
  </g>
</svg>